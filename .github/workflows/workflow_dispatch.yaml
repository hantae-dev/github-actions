name: workflow-dispatch
on:
  workflow_dispatch:
    inputs:
      name:
        description: "set name"
        required: true
        default: "github-actions"
        type: string
      env:
        description: "set env"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa

  jobs:
    workflow_dispatch-job:
      runs-on: ubuntu-latest
      steps:
        - name: step1
          run: echo 안녕
        - name: step2
          run: echo 잘가
        - name: echo inputs
          run: |
            echo ${{ inputs.name}}
            echo ${{ inputs.env}}
