name: workflow-dispatch # 워크플로우 이름

on:
  workflow_dispatch: # GitHub 웹 UI 또는 API에서 수동으로 실행할 수 있는 트리거
    inputs: # 워크플로우 실행 시 사용자에게 입력받을 값들 정의
      name:
        description: "set name"  # GitHub UI에서 보여줄 입력 필드 설명
        required: true           # 필수 입력값 (비워두면 실행 불가)
        default: "github-actions" # 기본값 (사용자가 입력 안 하면 이 값 사용)
        type: string             # 입력 타입: 자유롭게 문자열 입력
      env:
        description: "set env"
        required: true
        default: "dev"
        type: choice             # 입력 타입: 아래 options 목록 중 하나를 선택
        options:                 # 선택 가능한 옵션 목록
          - dev
          - qa

jobs:
  workflow_dispatch-job: # 잡 이름
    runs-on: ubuntu-latest # 워크플로우가 실행될 가상 머신 환경
    steps: # 순서대로 실행될 단계들
      - name: step1
        run: echo 안녕
      - name: step2
        run: echo 잘가
      - name: echo inputs
        run: | # | 는 여러 줄 명령어를 실행할 때 사용
          echo ${{ inputs.name}} # 사용자가 입력한 name 값 출력
          echo ${{ inputs.env}}  # 사용자가 입력한 env 값 출력
